<!-- ========================================
     ENCABEZADO DEL MODULO DE CLIENTES
========================================= -->
<div class="client-module-page">
  <header class="client-module-header">
    <h1>Módulo de Clientes</h1>
    <p>Gestiona clientes y la ubicación de tu red.</p>
  </header>

  <!-- ========================================
       ACCESOS PRINCIPALES DE CLIENTES
  ========================================= -->
  <section class="client-options" aria-label="Opciones del módulo de Clientes">
    <a class="client-option" routerLink="/clientes/gestion">
      <span class="client-option-icon client-option-icon-blue" aria-hidden="true">
        <svg viewBox="0 0 24 24" focusable="false">
          <circle cx="9" cy="8" r="3.6" />
          <path d="M2.8 19.8c.5-4 2.8-6.4 6.2-6.4s5.7 2.4 6.2 6.4" />
          <circle cx="17.2" cy="8.8" r="2.8" />
          <path d="M15.1 14.6c3.2-.8 5.7 1.3 6.1 5.2" />
        </svg>
      </span>
      <span class="client-option-label">Clientes</span>
    </a>

    @if (auth.hasModule('mapas')) {
      <a class="client-option" routerLink="/mapas">
        <span class="client-option-icon client-option-icon-green" aria-hidden="true">
          <svg viewBox="0 0 24 24" focusable="false">
            <path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z" />
            <circle cx="12" cy="10" r="2.5" />
          </svg>
        </span>
        <span class="client-option-label">Mapas</span>
      </a>
    }
  </section>
</div>
