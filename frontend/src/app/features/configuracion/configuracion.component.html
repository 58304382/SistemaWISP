<!-- ========================================
     ENCABEZADO DE CONFIGURACION
========================================= -->
<div class="configuration-page">
  <header class="configuration-header">
    <h1>Configuración</h1>
    <p class="page-description">
      Gestione usuarios, empleados, reportes y mantenimiento del sistema SistemaWISP.
    </p>
  </header>

  <!-- ========================================
       ACCESO A USUARIOS
  ========================================= -->
  <section class="configuration-content">
    <a class="configuration-option" routerLink="/usuarios">
      <span class="configuration-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" focusable="false">
          <circle cx="9" cy="8" r="3.6" />
          <path d="M2.8 19.8c.5-4 2.8-6.4 6.2-6.4s5.7 2.4 6.2 6.4" />
          <circle cx="17.2" cy="8.8" r="2.8" />
          <path d="M15.1 14.6c3.2-.8 5.7 1.3 6.1 5.2" />
        </svg>
      </span>
      <span class="configuration-option-label">Usuarios</span>
    </a>

    <!-- ========================================
         ACCESO A EMPLEADOS
    ========================================= -->
    <a class="configuration-option" routerLink="/configuracion/empleados">
      <span class="configuration-icon employees-configuration-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" focusable="false">
          <rect x="4" y="8" width="16" height="11" rx="1.2" />
          <path d="M9 8V5h6v3M4 12h16M10 12v1.5h4V12" />
        </svg>
      </span>
      <span class="configuration-option-label">Empleados</span>
    </a>

    <!-- ========================================
         ACCESO A REPORTES ADMINISTRATIVOS
    ========================================= -->
    <a class="configuration-option" routerLink="/configuracion/reportes">
      <span class="configuration-icon reports-configuration-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" focusable="false">
          <path d="M4 19V5M4 19h17" />
          <path d="M8 16v-5M12 16V7M16 16v-3M20 16V4" />
        </svg>
      </span>
      <span class="configuration-option-label">Reportes</span>
    </a>

    <!-- ========================================
         ACCESO A MANTENIMIENTO DEL SISTEMA
    ========================================= -->
    <a class="configuration-option" routerLink="/configuracion/mantenimiento">
      <span class="configuration-icon maintenance-configuration-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" focusable="false">
          <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z" />
        </svg>
      </span>
      <span class="configuration-option-label">Mantenimiento</span>
    </a>
  </section>
</div>
