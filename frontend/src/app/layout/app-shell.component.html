<!-- ========================================
     ESTRUCTURA DEL SHELL AUTENTICADO
========================================= -->
<a class="skip-link" href="#main-content">Saltar al contenido principal</a>

<div class="app-shell-layout">
  <app-sidebar
    id="system-navigation"
    [class.mobile-open]="mobileNavigationOpen()"
    [mobileOpen]="mobileNavigationOpen()"
    (tabletExpandedChange)="onTabletExpandedChange($event)"
    (closeRequested)="closeMobileNavigation(true)"
  />

  @if (tabletNavigationOpen()) {
    <button
      class="tablet-backdrop"
      type="button"
      tabindex="-1"
      aria-label="Cerrar menú de navegación"
      (click)="closeTabletNavigation()"
    ></button>
  }

  @if (mobileNavigationOpen()) {
    <button
      class="mobile-backdrop"
      type="button"
      tabindex="-1"
      aria-label="Cerrar menú de navegación"
      (click)="closeMobileNavigation(true)"
    ></button>
  }

  <div
    class="app-shell-main"
    [attr.inert]="mobileNavigationOpen() || tabletNavigationOpen() ? '' : null"
  >
    <header class="mobile-header">
      <button
        #mobileMenuButton
        class="mobile-menu-button"
        type="button"
        aria-label="Abrir menú de navegación"
        aria-controls="system-navigation"
        [attr.aria-expanded]="mobileNavigationOpen()"
        (click)="openMobileNavigation()"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M4 7h16M4 12h16M4 17h16" />
        </svg>
      </button>
      <div class="mobile-brand">
        <span class="mobile-brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" focusable="false">
            <path d="M4 10a12 12 0 0 1 16 0M7 13a8 8 0 0 1 10 0M10 16a4 4 0 0 1 4 0" />
            <circle cx="12" cy="19" r="1" fill="currentColor" stroke="none" />
          </svg>
        </span>
        <strong>SistemaWISP</strong>
      </div>
    </header>

    <div id="main-content" class="app-shell-page" tabindex="-1">
      <router-outlet />
    </div>
  </div>
</div>
