server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # La configuracion de entorno debe ser JavaScript real y no el fallback HTML de Angular.
    location = /runtime-config.js {
        try_files $uri =404;
        default_type application/javascript;
        add_header Cache-Control "no-store" always;
    }

    # Conserva /api al reenviar las solicitudes hacia FastAPI.
    location /api/ {
        proxy_pass http://sistemawisp1-backendwisp-ygevhu:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # FastAPI publica los archivos persistidos bajo el prefijo /uploads.
    location /uploads/ {
        proxy_pass http://sistemawisp1-backendwisp-ygevhu:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Angular gestiona las rutas; si no existe un archivo se entrega la SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
