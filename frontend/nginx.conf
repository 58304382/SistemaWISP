server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Conserva /api al reenviar las solicitudes hacia FastAPI.
    location /api/ {
        proxy_pass http://my-first-project-sistemawispbackend-ee5z7m:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # FastAPI publica los archivos persistidos bajo el prefijo /uploads.
    location /uploads/ {
        proxy_pass http://my-first-project-sistemawispbackend-ee5z7m:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Angular gestiona las rutas; si no existe un archivo se entrega la SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
